<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Competitor Tracker | Google Play Market Insights</title>
<!-- PapaParse parses the CSV; Chart.js renders the trend charts. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#FAF6F0; --ink:#2B2018; --accent:#8B5A2B;
    --slate:#7A6A58; --mist:#E6DDD1; --card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,'Segoe UI',Arial,sans-serif;
    font-size:15px;line-height:1.6;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
  h1{font-size:26px;margin-bottom:6px}
  .sub{color:var(--slate);font-size:13.5px;margin-bottom:34px}
  h2{font-size:17px;margin:38px 0 16px;color:var(--accent)}
  .panel{
    background:var(--card);border:1px solid var(--mist);
    border-radius:14px;padding:22px;
  }
  /* Latest snapshot table */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--mist)}
  th{color:var(--slate);font-weight:600;font-size:12.5px;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums}
  .loading{color:var(--slate);padding:40px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>App Competitor Tracker</h1>
  <p class="sub">Data source: Google Play (US), collected daily via GitHub Actions · CSV data: <a href="data.csv">data.csv</a></p>

  <h2>Latest Snapshot</h2>
  <div class="panel">
    <div id="table" class="loading">Loading competitor data...</div>
  </div>

  <h2>App Rating Trends</h2>
  <div class="panel"><canvas id="scoreChart" height="110"></canvas></div>

  <h2>Total Ratings Trends</h2>
  <div class="panel"><canvas id="ratingsChart" height="110"></canvas></div>
</div>

<script>
// Color palette: one line per app
const COLORS = ['#8B5A2B','#C0803F','#5A3E22','#A98A5B','#D9B382','#7A6A58'];

// Load data.csv from this repository
Papa.parse('data.csv', {
  download: true, header: true, skipEmptyLines: true,
  complete: (res) => {
    const rows = res.data;
    if (!rows.length) {
      document.getElementById('table').textContent = 'No data is available yet. Please refresh after the next scheduled data update.';
      return;
    }
    // Group records by app
    const apps = [...new Set(rows.map(r => r.app))];
    const dates = [...new Set(rows.map(r => r.date))].sort();

    // ===== Latest snapshot: use the most recent record for each app =====
    const latest = apps.map(name => {
      const rs = rows.filter(r => r.app === name);
      return rs[rs.length - 1];
    });
    let html = '<table><tr><th>App</th><th>Rating</th><th>Total Ratings</th><th>Reviews</th><th>Installs</th><th>Version</th><th>Last Updated</th></tr>';
    latest.forEach(r => {
      html += `<tr><td><b>${r.app}</b></td>
        <td class="num">${Number(r.score).toFixed(2)}</td>
        <td class="num">${Number(r.ratings).toLocaleString()}</td>
        <td class="num">${Number(r.reviews).toLocaleString()}</td>
        <td class="num">${r.installs}</td>
        <td>${r.version || '-'}</td><td>${r.date}</td></tr>`;
    });
    html += '</table>';
    document.getElementById('table').innerHTML = html;

    // ===== Trend chart helper: values for a given field by date =====
    const seriesOf = (field) => apps.map((name, i) => ({
      label: name,
      data: dates.map(d => {
        const hit = rows.find(r => r.app === name && r.date === d);
        return hit ? Number(hit[field]) : null;
      }),
      borderColor: COLORS[i % COLORS.length],
      backgroundColor: COLORS[i % COLORS.length],
      tension: .25, spanGaps: true, pointRadius: 3,
    }));

    const baseOpts = {
      responsive: true,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { grace: '5%' } },
    };
    new Chart(document.getElementById('scoreChart'),
      { type: 'line', data: { labels: dates, datasets: seriesOf('score') }, options: baseOpts });
    new Chart(document.getElementById('ratingsChart'),
      { type: 'line', data: { labels: dates, datasets: seriesOf('ratings') }, options: baseOpts });
  },
  error: () => {
    document.getElementById('table').textContent = 'Unable to load data.csv. Please verify that it is available in the same repository as index.html.';
  }
});
</script>
</body>
</html>
